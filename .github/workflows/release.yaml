---

name: Release

on:
  release:
    types: [created]

permissions:
  contents: write
  packages: write

jobs:
  release-matrix:
    name: Release Go Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # build and publish in parallel: linux/amd64, linux/arm64, darwin/amd64, darwin/arm64
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: wangyoucao577/go-release-action@279495102627de7960cbc33434ab01a12bae144b # v1.55
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        goos: ${{ matrix.goos }}
        goarch: ${{ matrix.goarch }}
        goversion: 1.23.6
        ldflags: -X "github.com/kuadrant/kuadrantctl/cmd.gitSHA=${{ github.sha }}" -X "github.com/kuadrant/kuadrantctl/cmd.version=${{ github.ref_name }}"
